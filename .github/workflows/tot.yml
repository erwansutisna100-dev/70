name: APEX-QUANT-OMNI SOVEREIGN v80.0 - TOT100 Pipeline

on:
  schedule:
    - cron: '30 13,16,19 * * 1-5'  # Berjalan otomatis di jam market (UTC)
  workflow_dispatch:              # Memungkinkan tombol Run Manual di tab Actions

permissions:
  contents: write

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sovereign Quantitative Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tot.py

      - name: Upload Artifacts (SQLite DB & Backtest Chart)
        uses: actions/upload-artifact@v4
        with:
          name: tot100-forensic-artifacts
          path: |
            tot100_signals.db
            backtest_performance.png
          retention-days: 30
